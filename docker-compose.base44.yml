services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - FRED_OS_ROOT=/app
      - FRED_OS_PROFILE=development
      - FRED_OS_TOKEN=fred-os-dev-token-2026
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
        pip install --no-cache-dir -e '.[dev,http]' &&
        python -m uvicorn --factory fred_os.dev_server:build_app --host 0.0.0.0 --port 3000
      "
