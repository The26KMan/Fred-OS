[meta]
schema_version = "2.0"
revision = "fred-os-vnext"
profile = "production"
tenant_id = "kamahni"
project_id = "fred-os"

[governance]
pass_floor = 0.75
review_floor = 0.50
block_ceiling = 0.25
protected_keys = ["governance.pass_floor", "governance.review_floor", "governance.block_ceiling", "runtime.active"]

[runtime]
active = true
max_chain_depth = 8
allow_env_overrides = false
state_store_path = "data/runtime_state.jsonl"
journal_path = "data/runtime.wal.jsonl"

[protocol]
default_mode = "CHAINING"
allow_genius_escalation = true

[memory]
repository_path = "data/fred_os_memory.sqlite3"
working_limit = 7
contextual_limit = 50
episodic_limit = 1000
heritage_injection_mode = "adaptive"

[temporal]
working_capacity = 5
micro_window = 5
meso_window = 4
episodic_min_reinforcement = 2
snapshot_path = "data/temporal_sphere_snapshot.json"
projection_limit = 3

[observability]
event_log_path = "data/events.jsonl"

[systems]
enabled = ["S1", "S2", "S5", "S6", "S7", "S8", "S9", "S10", "S11", "S12", "S13"]

[systems.maturity]
S1 = "implemented"
S2 = "implemented"
S3 = "candidate"
S4 = "candidate"
S5 = "implemented_adapter"
S6 = "tested_prototype_adapter"
S7 = "implemented_adapter"
S8 = "kernel_governance"
S9 = "implemented_adapter"
S10 = "candidate"
S11 = "candidate"
S12 = "implemented_adapter"
S13 = "candidate"

[systems.s1]
max_concepts = 15
min_phrase_chars = 3
max_ngram = 3
max_edges_per_node = 6
emergence_threshold = 0.48
completeness_retrieval_floor = 0.75
neural_overlay_enabled = false

[systems.s2]
max_edges_per_node = 5
similarity_floor = 0.40
transitive_decay = 0.80
uncertainty_budget = 0.75
max_bpt_bridges = 5
cross_domain_bonus = 0.12
