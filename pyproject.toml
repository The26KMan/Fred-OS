[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fred-os"
version = "0.9.0.dev0"
description = "Evidence-governed System-OS runtime with Semantic Memory Lake and immutable DeepLinks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Kamahni Huck"}]
license = {text = "Proprietary"}
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "uvicorn>=0.30"]
http = ["uvicorn>=0.30"]

[project.scripts]
fred-os = "fred_os.cli:main"
fred = "fred_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
