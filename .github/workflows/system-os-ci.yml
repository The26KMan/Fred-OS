name: system-os-ci

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install vNext package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Compile runtime sources
        run: python -m compileall -q src tests
      - name: Run runtime tests
        run: python -m pytest -q
